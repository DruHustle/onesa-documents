name: Deploy approved public Docs to Cloudflare shadow
'on':
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character main commit SHA to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-docs-shadow-review
  cancel-in-progress: false
jobs:
  direct-upload-preview:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject unreviewed revisions or non-main dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify approval, digest guards, and Cloudflare Free file limits
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_cloudflare_pages_compatibility.py -v
          python public/tools/build.py "$RUNNER_TEMP/onesa-public-pages"
          python public/tools/verify_pages.py "$RUNNER_TEMP/onesa-public-pages" "$RUNNER_TEMP/onesa-public-pages-manifest.json"
      - name: Deploy full verified bundle to preview-only Cloudflare Pages project
        env:
          # Set via GitHub repository/environment secrets; no token in source or logs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DIRECT_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ffe41f6678793e8dcc7f4a1c2f5e60d8
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Scoped Cloudflare Pages deploy credential is not configured' >&2; exit 1; }
          # No docs.onesa.eu DNS or production Pages branch is touched.
          npm exec --yes --package=wrangler@4.165.0 -- wrangler pages deploy "$RUNNER_TEMP/onesa-public-pages" \
            --project-name=onesa-public-docs-shadow --branch=review --commit-hash="$GITHUB_SHA"
      - name: Verify actual published bytes at separate Pages preview host
        run: |
          set -euo pipefail
          url=https://review.onesa-public-docs-shadow.pages.dev
          for entry in index.html 404.html; do
            curl --fail --location --silent --show-error --max-time 12 --retry 8 \
              --retry-delay 3 --retry-all-errors "$url/$entry" -o "$RUNNER_TEMP/served-$entry"
            cmp "$RUNNER_TEMP/onesa-public-pages/$entry" "$RUNNER_TEMP/served-$entry" || {
              echo 'Cloudflare preview content differs from approved public artifact' >&2
              exit 1
            }
          done
          echo 'Exact reviewed public entrypoints served by shadow Pages preview; production DNS unchanged.'
