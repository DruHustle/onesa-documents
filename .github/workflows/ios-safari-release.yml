name: Verify published Web journeys on iOS Safari
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-safari-release.yml
      - tests/mobile_safari_release.py
permissions:
  contents: read
jobs:
  mobile-safari:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run anonymous release journeys in the iPhone simulator
        run: python3 tests/mobile_safari_release.py
