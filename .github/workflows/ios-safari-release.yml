name: Verify published Web journeys on iOS Safari
on:
  workflow_dispatch:
  push:
    branches:
      - test/mobile-safari-public-experiences
  pull_request:
    paths:
      - .github/workflows/ios-safari-release.yml
      - tests/mobile_safari_release.py
      - tests/ios-browser/**
permissions:
  contents: read
jobs:
  mobile-safari:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run anonymous release journeys in the iPhone simulator
        run: python3 tests/mobile_safari_release.py
      - name: Capture failed Mobile Safari simulator display
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/safari-diagnostics"
          xcrun simctl io booted screenshot "$RUNNER_TEMP/safari-diagnostics/simulator.png" || true
          xcrun simctl list devices booted > "$RUNNER_TEMP/safari-diagnostics/booted-devices.txt" || true
      - name: Retain failed Safari diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-docs-mobile-safari-diagnostics
          path: ${{ runner.temp }}/safari-diagnostics/
          if-no-files-found: warn
          retention-days: 3

  public-guide-native-touch:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the iPhone keyboard to search and tap a public guide in Safari
        run: |
          work="$RUNNER_TEMP/public-docs-native"
          mkdir -p "$work"
          if ! ruby -rxcodeproj -e 'exit' >/dev/null 2>&1; then
            gem install xcodeproj --version 1.27.0 --install-dir "$work/gems" --no-document
            export GEM_PATH="$work/gems:$(ruby -e 'puts Gem.path.join(":")')"
          fi
          ruby tests/ios-browser/ios-test-project.rb "$work/host" "$PWD/tests/ios-browser/PublicGuideTests.swift"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl boot "$device" || xcrun simctl list devices booted | grep -F "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl openurl "$device" https://docs.onesa.eu/
          bash tests/ios-browser/run-native-guide.sh "$work" "$device"
      - name: Retain failed native Safari XCTest diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-docs-native-safari-xcresult
          path: |
            ${{ runner.temp }}/public-docs-native/results-*.xcresult/
            ${{ runner.temp }}/public-docs-native/xcode-*.log
          if-no-files-found: warn
          retention-days: 3
