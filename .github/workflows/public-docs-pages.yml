name: Export public Docs static bundle
'on':
  pull_request:
    paths:
      - 'public/**'
      - 'tests/test_cloudflare_pages_compatibility.py'
      - '.github/workflows/public-docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/test_cloudflare_pages_compatibility.py'
      - '.github/workflows/public-docs-pages.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-static:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test static public Pages asset guards
        run: python -m unittest discover -s tests -p test_cloudflare_pages_compatibility.py -v
      - name: Build only approved checksum-bound public files
        run: python public/tools/build.py "$RUNNER_TEMP/onesa-public-pages"
      - name: Validate Cloudflare Pages Free asset constraints
        run: python public/tools/verify_pages.py "$RUNNER_TEMP/onesa-public-pages" "$RUNNER_TEMP/onesa-public-pages-manifest.json"
      - name: Retain static public bundle and checksums for reviewed deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onesa-public-pages-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/onesa-public-pages/
            ${{ runner.temp }}/onesa-public-pages-manifest.json
          retention-days: 3
          if-no-files-found: error
